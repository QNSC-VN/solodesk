services:
  postgres:
    # pgvector preinstalled — same Postgres 18 base image, needed for
    # agent-orchestrator's knowledge-base embeddings (Layer B / RAG).
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: solodesk
      POSTGRES_USER: solodesk_superuser
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    volumes:
      - solodesk_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solodesk_superuser -d solodesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  solodesk_pg_data:
