[pytest]
asyncio_mode = auto
; The asyncpg pool in app/db.py is a module-level singleton, matching how
; it's actually used in the running app (created once, reused for the
; process's lifetime) — a per-test event loop would create it under one
; loop, then a second test's fresh loop finds it closed. Session-scoped
; loop/fixtures keep all tests on the one loop the pool was created under.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
